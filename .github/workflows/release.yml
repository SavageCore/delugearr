name: release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Install
        run: uv sync --all-groups --frozen
      - name: Lint + test
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run pytest
      - name: Build release
        run: uv build -o dist
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: dist/*.whl
