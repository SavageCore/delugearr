version: 2
updates:
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
    versioning-strategy: increase
    groups:
      runtime:
        patterns: ["nicegui", "requests"]
      dev:
        patterns: ["ruff", "pytest"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
