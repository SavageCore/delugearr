# Tailnet-only vhost for delugearr. Bound to the seedbox's Tailscale IP, so it
# is unreachable from the public internet; Tailscale already encrypts in
# transit. Served with a Tailscale TLS cert for the *.ts.net hostname.
#
# Template: __TAILSCALE_IP__ is replaced by deploy.sh with `tailscale ip -4`.
# Deliberately mirrors nginx-delugearr.conf's location blocks but WITHOUT
# auth_basic - tailnet clients are trusted (Settings > Security > trusted
# networks lets them skip the app login too). The API still requires the key.
server {
    listen __TAILSCALE_IP__:443 ssl;
    server_name __TAILSCALE_HOSTNAME__;

    ssl_certificate /etc/ssl/tailscale/__TAILSCALE_HOSTNAME__.crt;
    ssl_certificate_key /etc/ssl/tailscale/__TAILSCALE_HOSTNAME__.key;

    # The API is protected by the app's API key (X-Api-Key header / apikey
    # query param). Must be a ^~ prefix longer than the UI block below so it
    # wins for /api paths.
    location ^~ /delugearr/api {
        proxy_pass http://127.0.0.1:11012;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_http_version 1.1;
    }

    # UI under the BASE_PATH prefix. NiceGUI mounts itself at /delugearr, so
    # DO NOT send X-Forwarded-Prefix here - it would double-prefix asset URLs
    # and break the ES-module client. WebSocket headers are required.
    location ^~ /delugearr {
        proxy_pass http://127.0.0.1:11012;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}