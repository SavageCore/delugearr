# Place in /etc/nginx/apps/delugearr.conf (swizzin includes the dir).
# Mirrors cleanuparr.conf. UI is served at the root domain under the BASE_PATH
# prefix (no subdomain). WebSocket headers are required for the NiceGUI client.
location ^~ /delugearr {
    proxy_pass http://127.0.0.1:11012;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /delugearr;
    proxy_redirect off;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    auth_basic "What's the password?";
    auth_basic_user_file /etc/htpasswd.d/htpasswd.savagecore;
}
