# The API is already protected by the app's API key (X-Api-Key header /
# apikey query param), so it must NOT sit behind basic auth - the MCP server
# and headless tooling only send the API key. Must be a ^~ prefix longer than
# the UI block below so it wins for /api paths.
location ^~ /delugearr/api {
    proxy_pass http://127.0.0.1:11012;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;
    proxy_http_version 1.1;
}

# UI at the root domain under the BASE_PATH prefix (no subdomain). NiceGUI
# mounts itself at /delugearr (mount_path), so DO NOT send X-Forwarded-Prefix
# here - it would double-prefix asset URLs and break the ES-module client.
# WebSocket headers are required for the client.
location ^~ /delugearr {
    proxy_pass http://127.0.0.1:11012;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    auth_basic "What's the password?";
    auth_basic_user_file /etc/htpasswd.d/htpasswd.savagecore;
}
